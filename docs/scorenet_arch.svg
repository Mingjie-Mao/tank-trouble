<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">P21b 评分网络：408 维全知观测 → 1024×3 MLP → 18 候选动作评分（约 2.5M 参数）</text>

  <!-- ===== 输入块 ===== -->
  <text x="145" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">输入：当前帧的物理事实</text>

  <rect x="40" y="72" width="210" height="88" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">基础观测 125 维</text>
  <text x="145" y="111" text-anchor="middle" font-size="11" fill="#1e40af">自车6 · 敌车8 · 射线24 · 弹槽36</text>
  <text x="145" y="127" text-anchor="middle" font-size="11" fill="#1e40af">弹道预演24 · 射击扇21</text>
  <text x="145" y="143" text-anchor="middle" font-size="11" fill="#1e40af">导航4 · 计时/扳机2</text>

  <rect x="40" y="166" width="210" height="48" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="145" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">★ 动作条件预演 18 维</text>
  <text x="145" y="203" text-anchor="middle" font-size="11" fill="#92400e">9 种走法 × [会中弹? 几帧后]</text>

  <rect x="40" y="220" width="210" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="145" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">弹槽补全 24 维</text>
  <text x="145" y="253" text-anchor="middle" font-size="11" fill="#3730a3">第 7-10 颗子弹 × 6</text>

  <rect x="40" y="266" width="210" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="145" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">全迷宫位图 240 维</text>
  <text x="145" y="303" text-anchor="middle" font-size="11" fill="#166534">12×10 格 × [下墙, 左墙]</text>

  <rect x="40" y="320" width="210" height="30" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="145" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">卡墙标志 1 维</text>

  <text x="145" y="374" text-anchor="middle" font-size="11" fill="#6b7280">无未来函数 · 只报事实不做判断</text>

  <!-- 合并括号 -->
  <path d="M 258 72 L 268 72 L 268 350 L 258 350" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="290" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">408</text>
  <text x="290" y="222" text-anchor="middle" font-size="11" fill="#6b7280">维</text>

  <!-- 箭头 输入->隐层 -->
  <line x1="304" y1="211" x2="336" y2="211" stroke="#374151" stroke-width="2"/>
  <polygon points="336,206 346,211 336,216" fill="#374151"/>

  <!-- ===== 隐层 ===== -->
  <rect x="350" y="116" width="88" height="190" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="394" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">1024</text>
  <text x="394" y="222" text-anchor="middle" font-size="11" fill="#5b21b6">ReLU</text>

  <line x1="438" y1="211" x2="458" y2="211" stroke="#374151" stroke-width="2"/>
  <polygon points="458,206 468,211 458,216" fill="#374151"/>

  <rect x="472" y="116" width="88" height="190" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="516" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">1024</text>
  <text x="516" y="222" text-anchor="middle" font-size="11" fill="#5b21b6">ReLU</text>

  <line x1="560" y1="211" x2="580" y2="211" stroke="#374151" stroke-width="2"/>
  <polygon points="580,206 590,211 580,216" fill="#374151"/>

  <rect x="594" y="116" width="88" height="190" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="638" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">1024</text>
  <text x="638" y="222" text-anchor="middle" font-size="11" fill="#5b21b6">ReLU</text>

  <line x1="682" y1="211" x2="702" y2="211" stroke="#374151" stroke-width="2"/>
  <polygon points="702,206 712,211 702,216" fill="#374151"/>

  <!-- ===== 输出 ===== -->
  <rect x="716" y="96" width="120" height="230" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="776" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">18 个动作评分</text>
  <!-- 评分条 (示意) -->
  <rect x="730" y="132" width="52" height="8" rx="2" fill="#fca5a5"/>
  <rect x="730" y="146" width="78" height="8" rx="2" fill="#fca5a5"/>
  <rect x="730" y="160" width="92" height="8" rx="2" fill="#dc2626"/>
  <text x="828" y="168" font-size="10" fill="#dc2626">←max</text>
  <rect x="730" y="174" width="40" height="8" rx="2" fill="#fca5a5"/>
  <rect x="730" y="188" width="64" height="8" rx="2" fill="#fca5a5"/>
  <rect x="730" y="202" width="24" height="8" rx="2" fill="#fca5a5"/>
  <rect x="730" y="216" width="70" height="8" rx="2" fill="#fca5a5"/>
  <text x="776" y="242" text-anchor="middle" font-size="11" fill="#991b1b">…（共 18 条）</text>
  <text x="776" y="266" text-anchor="middle" font-size="11" fill="#991b1b">动作 = 油门(3) ×</text>
  <text x="776" y="282" text-anchor="middle" font-size="11" fill="#991b1b">转向(3) × 开火(2)</text>
  <text x="776" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">argmax 直接执行</text>

  <!-- ===== 底部: 训练与部署 ===== -->
  <rect x="40" y="404" width="430" height="112" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="58" y="428" font-size="13" font-weight="bold" fill="#111827">训练（搜索蒸馏）</text>
  <text x="58" y="450" font-size="12" fill="#374151">标签 = MPC 老师对 18 个候选各自沙盘推演 48 帧的评分</text>
  <text x="58" y="470" font-size="12" fill="#374151">（击杀≈+1000−t，死亡≈−1000+t）÷1000，MSE 回归</text>
  <text x="58" y="490" font-size="12" fill="#374151">同一决策步 18 候选共用沙盒种子（配对比较，治并列陷阱）</text>

  <rect x="490" y="404" width="430" height="112" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="508" y="428" font-size="13" font-weight="bold" fill="#111827">部署（纯网络）</text>
  <text x="508" y="450" font-size="12" fill="#374151">单次前向 8.6ms/决策 · 纯 CPU · 零搜索、零候选比较</text>
  <text x="508" y="470" font-size="12" fill="#374151">真胜率 62.2% / 63.8%（双基 1500 局定级）</text>
  <text x="508" y="490" font-size="12" fill="#374151">学的是"动作后果的价值地形"，不是模仿动作</text>
</svg>
